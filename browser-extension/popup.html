<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fetch Download Manager</title><link rel="stylesheet" href="popup.css"></head>
<body><main><header><span class="mark">↓</span><div><h1>Fetch</h1><small>Browser companion</small></div></header>
<label for="url">Direct download URL</label><input id="url" type="url" spellcheck="false" placeholder="https://example.com/file.zip" />
<button id="send">Download with Fetch</button>
<p id="status" role="status" aria-live="polite">Use the right-click menu on a file link, or paste its URL here.</p>
<hr><label class="toggle"><input id="capture" type="checkbox"> Capture browser downloads automatically</label>
<p class="note">Experimental. Off by default. Chrome/Edge only. This does not capture YouTube videos or protected streams.</p>
</main><script src="popup.js"></script></body></html>
