name: Build Windows installer

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and build
        shell: pwsh
        run: |
          dotnet restore src/Fetch.Desktop/Fetch.Desktop.csproj
          dotnet build src/Fetch.Desktop/Fetch.Desktop.csproj --configuration Release --no-restore

      - name: Run self-contained unit and local HTTP integration tests
        shell: pwsh
        run: dotnet run --project tests/Fetch.Tests/Fetch.Tests.csproj --configuration Release

      - name: Validate browser extension
        shell: pwsh
        run: |
          node --check browser-extension/background.js
          node --check browser-extension/popup.js
          node --check browser-extension/media-utils.js
          node --check browser-extension/content.js
          node tests/browser-extension/bridge-smoke.cjs
          node tests/browser-extension/media-smoke.cjs

      - name: Publish for Windows x64 (self-contained)
        shell: pwsh
        run: |
          dotnet publish src/Fetch.Desktop/Fetch.Desktop.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            --output artifacts/publish `
            -p:PublishSingleFile=false -p:DebugType=none -p:DebugSymbols=false

      - name: Build native messaging host
        shell: pwsh
        run: dotnet build src/Fetch.NativeHost/Fetch.NativeHost.csproj --configuration Release

      - name: Publish native messaging host
        shell: pwsh
        run: |
          dotnet publish src/Fetch.NativeHost/Fetch.NativeHost.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            --output artifacts/native `
            -p:PublishSingleFile=false -p:DebugType=none -p:DebugSymbols=false

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compile Windows setup.exe
        shell: pwsh
        run: |
          $paths = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "C:\ProgramData\chocolatey\bin\ISCC.exe"
          )
          $compiler = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) { throw 'Inno Setup compiler (ISCC.exe) not found.' }
          & $compiler installer/Fetch.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Make portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/portable -Force | Out-Null
          Copy-Item -Path artifacts/publish/* -Destination artifacts/portable -Recurse -Force
          Copy-Item -Path artifacts/native -Destination artifacts/portable/native -Recurse -Force
          Copy-Item -Path browser-extension -Destination artifacts/portable/browser-extension -Recurse -Force
          Copy-Item -Path scripts -Destination artifacts/portable/scripts -Recurse -Force
          Compress-Archive -Path artifacts/portable/* `
            -DestinationPath artifacts/FetchPortable-win-x64.zip -Force

      - name: Upload setup.exe and portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Fetch-Windows-x64
          path: |
            artifacts/installer/FetchSetup-win-x64.exe
            artifacts/FetchPortable-win-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish installers as release assets (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/installer/FetchSetup-win-x64.exe
            artifacts/FetchPortable-win-x64.zip
          generate_release_notes: true
